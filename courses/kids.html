<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كورس الرسم للأطفال</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
        .course-wrap {
            padding-top: 140px;
            max-width: 1000px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topbar h2 {
            font-size: 2rem;
            margin: 0;
            color: #FF5733;
        }

        .hello {
            color: #666;
            font-size: 1rem;
            margin-right: 15px;
        }

        .logout-btn {
            background: #FF5733;
            color: #121212;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.2s;
        }

        .logout-btn:hover {
            transform: scale(1.05);
        }

        .videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .video-card {
            background: #f9f9f9;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .video-card video {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .video-info {
            padding: 12px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .video-info span {
            font-weight: 600;
            color: #333;
            font-size: 1rem;
        }

        .video-info small {
            color: #999;
            font-size: 0.85rem;
        }
    </style>

    <script>
        (function () {
            const courseKey = "kids";
            const sessionKey = `shnshart:session:${courseKey}`;
            const saved = localStorage.getItem(sessionKey);
            if (!saved) {
                alert("من فضلك ادخل الكورس من الصفحة الرئيسية بعد كتابة الاسم وكلمة السر.");
                location.href = "../index.html#courses";
                return;
            }
            try {
                const { name } = JSON.parse(saved);
                window.CURRENT_STUDENT = { name, courseKey };
            } catch {
                localStorage.removeItem(sessionKey);
                alert("حدث خطأ في الجلسة. حاول الدخول مرة أخرى.");
                location.href = "../index.html#courses";
            }
        })();
    </script>
</head>

<body>
    <nav id="navbar">
        <div class="logo">
            <img src="../images/logo.png" alt="لوغو منصة الفنان" />
            <span>لمسة فن</span>
        </div>
        <ul>
            <li><a href="../index.html">الصفحة الرئيسية</a></li>
            <li><a href="../index.html#contact">تواصل معنا</a></li>
        </ul>
        <div class="menu-icon" onclick="toggleSidebar()">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </nav>

    <section class="course-wrap">
        <div class="topbar">
            <h2>كورس الرسم للأطفال</h2>
            <div>
                <span class="hello">أهلاً، <strong id="studentName">طالب</strong></span>
                <button class="logout-btn" onclick="logoutCourse()">تسجيل خروج</button>
            </div>
        </div>

        <div class="videos">
            <div class="video-card">
                <video controls>
                    <source src="../videos/kids1.mp4" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
                <div class="video-info">
                    <span>درس 1: مقدمة للرسم للأطفال</span>
                    <small>الرسم للأطفال</small>
                </div>
            </div>

        </div>
    </section>

    <script>
        (function () {
            const { name, courseKey } = window.CURRENT_STUDENT || {};
            if (name) document.getElementById("studentName").textContent = name;
            window.logoutCourse = function () {
                const sessionKey = `shnshart:session:${courseKey}`;
                localStorage.removeItem(sessionKey);
                location.href = "../index.html#courses";
            };
        })();

        function toggleSidebar() {
            document.getElementById("sidebar")?.classList.toggle("open");
        }

        window.addEventListener("scroll", function () {
            let navbar = document.getElementById("navbar");
            if (navbar) {
                if (window.scrollY > 50) navbar.classList.add("scrolled");
                else navbar.classList.remove("scrolled");
            }
        });
    </script>
</body>

</html>
